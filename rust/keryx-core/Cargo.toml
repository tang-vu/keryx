[package]
name = "keryx-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
serde_json = { version = "=1.0.145", features = ["preserve_order", "float_roundtrip", "raw_value"] }
serde_core = "=1.0.229"
rustpython-wtf8 = "=0.5.0"
sha2 = "=0.10.9"
ryu-js = "=1.0.3"
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
same-file = "=1.0.6"
