[package]
name = "keryx-operator"
version = "0.4.2"
description = "Keryx Operator private desktop alpha"
edition = "2021"
rust-version = "1.88"
build = "build.rs"

[[bin]]
name = "KeryxOperator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }
sha2 = "=0.10.9"

[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = "=2.8.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading",
] }
