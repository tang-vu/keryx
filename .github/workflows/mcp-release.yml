name: Publish accepted MCP tarball

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release tag for exact-source MCP package
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: mcp-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Resolve release and successful exact-source CI
        id: source
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        with:
          script: |
            const { owner, repo } = context.repo;
            let tag = process.env.RELEASE_TAG;
            if (context.eventName === 'workflow_run') {
              const data = (await github.rest.repos.getContent({ owner, repo, path: 'package.json', ref: context.payload.workflow_run.head_sha })).data;
              tag = `v${JSON.parse(Buffer.from(data.content, 'base64').toString('utf8')).version}`;
            }
            const release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            if (release.draft) throw new Error('Release must be published');
            let ref = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })).data.object;
            while (ref.type === 'tag') ref = (await github.rest.git.getTag({ owner, repo, tag_sha: ref.sha })).data.object;
            if (ref.type !== 'commit') throw new Error('Tag must resolve to commit');
            if (context.eventName === 'workflow_run' && ref.sha !== context.payload.workflow_run.head_sha) { core.info('Version tag belongs to a different source; skip'); return; }
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, { owner, repo, workflow_id: 'ci.yml', head_sha: ref.sha, branch: 'main', event: 'push', status: 'success', per_page: 100 });
            if (!runs.some(run => run.head_sha === ref.sha && run.conclusion === 'success')) throw new Error('Exact release source has not passed main CI');
            core.setOutput('sha', ref.sha);
            core.setOutput('tag', tag);
      - uses: actions/checkout@v4
        if: steps.source.outputs.sha != ''
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/setup-node@v4
        if: steps.source.outputs.sha != ''
        with:
          node-version: '24.21.0'
      - name: Install project-pinned npm
        if: steps.source.outputs.sha != ''
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Install pinned build and MCP dependency closures
        if: steps.source.outputs.sha != ''
        run: |
          npm ci --no-audit --no-fund
          npm --prefix mcp ci --ignore-scripts --no-audit --no-fund
      - name: Build and pack allowlisted MCP files
        if: steps.source.outputs.sha != ''
        working-directory: mcp
        run: |
          npm run build
          mkdir -p ../mcp-assets
          npm pack --ignore-scripts --json --pack-destination ../mcp-assets > ../mcp-assets/pack.json
          node --input-type=module -e 'import fs from "node:fs"; const [pack]=JSON.parse(fs.readFileSync("../mcp-assets/pack.json")); for(const file of pack.files) { if (!["package.json","README.md","dist/keryx-mcp.mjs"].includes(file.path)) throw Error("Unexpected package path: "+file.path); } if(pack.files.length!==3) throw Error("Expected exactly package manifest, README and bundle");'
      - name: Verify clean packaged consumer with synthetic signing and recovery
        if: steps.source.outputs.sha != ''
        run: node mcp/scripts/test-packed.mjs "$(find mcp-assets -name '*.tgz' -type f)" "$(npm root -g)/npm/bin/npm-cli.js"
      - name: Record source provenance and publish immutable package fallback
        if: steps.source.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import crypto from "node:crypto"; const [pack]=JSON.parse(fs.readFileSync("mcp-assets/pack.json")); const version=JSON.parse(fs.readFileSync("mcp/package.json")).version; const bytes=fs.readFileSync("mcp-assets/"+pack.filename); fs.writeFileSync("mcp-assets/"+pack.filename+".source.json", JSON.stringify({sourceCommit:process.env.SOURCE_SHA,version,filename:pack.filename,sha256:crypto.createHash("sha256").update(bytes).digest("hex"),npmRegistryPublished:false},null,2)+"\n");'
          package=$(find mcp-assets -name '*.tgz' -type f)
          manifest="$package.source.json"
          # Existing bytes are immutable. A repeat must verify provenance and package bytes.
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | rg --fixed-strings --line-regexp --quiet "$(basename "$package")"; then
            mkdir existing
            gh release download "$RELEASE_TAG" --pattern "$(basename "$package")*" --dir existing
            cmp "$manifest" "existing/$(basename "$manifest")"
            cmp "$package" "existing/$(basename "$package")"
            echo 'Accepted MCP package already published; no assets replaced'
          else
            gh release upload "$RELEASE_TAG" "$package" "$manifest"
          fi
