name: Gateway funding observer deadlines
on:
  pull_request:
    paths:
      - "lib/payments/gateway-funding-receipt-observer*"
      - "lib/payments/gateway-funding-receipt-policy.ts"
      - "lib/payments/gateway-funding-transaction.ts"
      - ".github/workflows/gateway-funding-observer.yml"
  workflow_dispatch:
jobs:
  gateway-funding-observer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.10.0"
          cache: npm
      - run: npm ci
      - name: Actual receipt observer and blocked timer acceptance
        run: npx vitest run lib/payments/gateway-funding-receipt-observer.test.ts
      - name: Project TypeScript
        run: npx tsc --noEmit
      - name: Scoped observer lint
        run: npx eslint lib/payments/gateway-funding-receipt-observer.ts lib/payments/gateway-funding-receipt-observer.test.ts
