name: PostgreSQL Mainnet Preparation

on:
  pull_request:
    paths:
      - "lib/db/**"
      - "lib/gateway/**"
      - "lib/payments/**"
      - "lib/session/**"
      - "lib/arc-network-profile.ts"
      - "supabase/migrations/**"
      - "scripts/helpers/enrolled-postgres-schema-contract*"
      - "lib/canonical-json.ts"
      - "scripts/postgres/**"
      - "ops/keryx-postgres/**"
      - "package*.json"
      - "tsconfig*.json"
      - ".github/workflows/postgres-mainnet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KERYX_NETWORK: arcTestnet
  NEXT_PUBLIC_KERYX_NETWORK: arcTestnet
  KERYX_FORCE_OFFLINE: "1"
  SUPABASE_URL: ""
  SUPABASE_SERVICE_ROLE_KEY: ""
  NEXT_PUBLIC_SUPABASE_URL: ""
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ""

jobs:
  contracts-bootstrap-financial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typed operational and application contracts
        run: npm run typecheck
      - name: Bounded transport, terminal disposal and lossless row regressions
        run: npx vitest run lib/db/postgres lib/db/postgres-business-core.test.ts scripts/postgres/ci-partitions.test.mts scripts/postgres/typed-snapshot.test.mts scripts/postgres/native-materialization-codec.test.mts scripts/postgres/ownership-history-projection.test.mts scripts/postgres/privacy-projection.test.mts scripts/postgres/publication-packet.test.mts scripts/postgres/usage-projection.test.mts scripts/postgres/ledger-projection.test.mts scripts/postgres/acceptance-projection.test.mts --maxWorkers=1
      - name: Pinned PostgreSQL and Node fixture images
        run: |
          docker pull postgres:17-alpine
          docker pull postgres@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
          docker pull node:24.22.1-bookworm-slim
      - name: Actual synthetic PostgreSQL transport, role isolation and snapshot copy
        run: node --import tsx --no-warnings scripts/postgres/test-bootstrap.mts
      - name: Native consent, funding, withdrawals and retained hosted ledger
        run: node --import tsx --no-warnings scripts/postgres/test-session-consents.mts --owner-withdrawals

  native-runtime-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Pinned PostgreSQL and Node fixture images
        run: |
          docker pull postgres:17-alpine
          docker pull postgres@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
          docker pull node:24.22.1-bookworm-slim
      - name: Native Linux cold factory and current protocols
        run: node --import tsx --no-warnings scripts/postgres/test-session-consents.mts --native-runtime-only

  native-runtime-tail:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Pinned PostgreSQL and Node fixture images
        run: |
          docker pull postgres:17-alpine
          docker pull postgres@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
          docker pull node:24.22.1-bookworm-slim
      - name: Native read, auth, operational and financial regressions
        run: node --import tsx --no-warnings scripts/postgres/test-session-consents.mts --native-runtime-tail-only

  synthetic-materialization:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Pinned PostgreSQL and Node fixture images
        run: |
          docker pull postgres:17-alpine
          docker pull postgres@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
          docker pull node:24.22.1-bookworm-slim
      - name: Held native public data, Source metadata and original-key cold factory
        env:
          NODE_OPTIONS: --max-old-space-size=512
        run: node --import tsx --no-warnings scripts/postgres/qualify-native-materialization.mts --synthetic

  publication-contained:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Pinned publication fixture images
        run: |
          docker pull postgres@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
          docker pull node@sha256:be8204d4bd327363357f532187b752ff62759c31bedf98e9e18fc08c9cbd605c
      - name: Compiled publication under actual 512 MiB containment
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: node --import tsx --no-warnings scripts/postgres/test-session-consents.mts --publication-contained-only

  a2a-fulfillment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Pinned PostgreSQL fixture image
        run: docker pull postgres@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
      - name: Failed-original fulfillment against the pinned full runtime catalog
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: node --import tsx --no-warnings scripts/postgres/test-session-consents.mts --a2a-fulfillment-only

  payment-browser-protocols:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Pinned PostgreSQL fixture image
        run: docker pull postgres@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
      - name: Source payment and historical browser protocols
        run: node --import tsx --no-warnings scripts/postgres/test-session-consents.mts --payment-browser-only
      - name: Source observation after an actual writer wait
        run: node --import tsx --no-warnings scripts/postgres/test-session-consents.mts --payment-observer-wait-only
      - name: Hosted producers and receipts with immutable Source originals
        run: node --import tsx --no-warnings scripts/postgres/test-session-consents.mts --hosted-source-payments-only
      - name: Source evidence, verification and article offers
        run: node --import tsx --no-warnings scripts/postgres/test-session-consents.mts --source-observations-offers-only
      - name: Source Operator views and withdrawal reporting
        run: node --import tsx --no-warnings scripts/postgres/test-session-consents.mts --operator-withdrawal-only
      - name: Source public archive fidelity and atomic writes
        run: node --import tsx --no-warnings scripts/postgres/test-session-consents.mts --reference-archive-only

  current-producer-protocols:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Pinned PostgreSQL fixture image
        run: docker pull postgres@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
      - name: Private Source producers, readers and original-bound results
        env:
          KERYX_NETWORK: arc
          NEXT_PUBLIC_KERYX_NETWORK: arc
          KERYX_FORCE_OFFLINE: "0"
          KERYX_REGISTRY_ADDRESS: "0x5555555555555555555555555555555555555555"
          NEXT_PUBLIC_KERYX_REGISTRY_ADDRESS: "0x5555555555555555555555555555555555555555"
          KERYX_MAINNET_TREASURY_PRIVATE_KEY: ""
          KERYX_MAINNET_PRIVATE_TREASURY_PRIVATE_KEY: ""
          REGISTRY_OPERATOR_KEY: ""
        run: node --import ./scripts/postgres/private-source-bootstrap.mjs --import tsx --no-warnings scripts/postgres/test-session-consents.mts --private-research-only
      - name: Registration sponsorship storage without an issuer or custody
        run: node --import tsx --no-warnings scripts/postgres/test-session-consents.mts --registration-sponsor-only
      - name: Onramp reservation metadata without funding
        run: node --import tsx --no-warnings scripts/postgres/test-session-consents.mts --onramp-only
      - name: Current selected scholarly closure
        run: node --import tsx --no-warnings scripts/postgres/test-session-consents.mts --scholarly-only
      - name: Metadata origin admission and content writes
        run: node --import tsx --no-warnings scripts/postgres/test-session-consents.mts --content-writes-only
      - name: Raw Source payment observations
        run: node --import tsx --no-warnings scripts/postgres/test-session-consents.mts --payment-observers-only
      - name: Consumed financial fields and original receipt holds
        run: node --import tsx --no-warnings scripts/postgres/test-session-consents.mts --payment-consumed-fields-only

  postgres-preparation:
    if: ${{ always() }}
    needs: [contracts-bootstrap-financial, native-runtime-core, native-runtime-tail, synthetic-materialization, publication-contained, a2a-fulfillment, payment-browser-protocols, current-producer-protocols]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful acceptance from every partition
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const required = ["contracts-bootstrap-financial", "native-runtime-core", "native-runtime-tail", "synthetic-materialization", "publication-contained", "a2a-fulfillment", "payment-browser-protocols", "current-producer-protocols"];
            const needs = JSON.parse(process.env.NEEDS_JSON);
            if (Object.keys(needs).length !== required.length || required.some(name => needs[name]?.result !== "success")) {
              console.error("PostgreSQL acceptance refused", needs);
              process.exit(1);
            }
          '
      - name: Refuse workflow cancellation
        if: ${{ cancelled() }}
        run: exit 1
