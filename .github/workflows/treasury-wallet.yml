name: Existing treasury wallet custody

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Superseded PR checks are cancelled; push/manual/release runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  custody:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - name: Pin repository npm installer
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Synthetic existing custody and independent process checks
        run: npx vitest run lib/payments/persistent-treasury-wallet.test.ts lib/payments/treasury-spend-wallet.test.ts lib/payments/real-gateway-custody.test.ts lib/payments/real-gateway-privacy.test.ts lib/payments/guarded-arc-transaction.test.ts lib/payments/pinned-arc-batch-signer.test.ts lib/payments/real-gateway-funding.test.ts scripts/treasury-script-isolation.test.ts scripts/code-golf-retirement.test.ts scripts/generate-wallets-retirement.test.ts
      - name: Typecheck maintained treasury MTS entry points
        run: npx tsc --noEmit -p tsconfig.treasury-scripts.json
      - name: Install caller-local MCP dependency closure
        run: npm --prefix mcp ci --ignore-scripts --no-audit --no-fund
      - name: Verify bounded compatibility validators in both installed closures
        run: node scripts/patch-legacy-zod.mjs
      - name: Synthetic caller-local payment and journal recovery checks
        run: npx vitest run --config mcp/vitest.config.mts
      - name: Typecheck caller-local MCP MTS entry points
        run: npx tsc --noEmit -p mcp/tsconfig.json
      - name: Build caller-local MCP bundle
        run: npm --prefix mcp run build
      - name: Pack only caller-local MCP release inputs
        working-directory: mcp
        shell: bash
        run: |
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/keryx-mcp-pack.json"
          node mcp/scripts/assert-package-files.mjs "$RUNNER_TEMP/keryx-mcp-pack.json"
      - name: Clean installed MCP synthetic signing and new-process recovery
        shell: bash
        # Keep the fresh consumer on the runner's managed scratch volume instead
        # of the Windows user-profile temp directory; retain the 120s install gate.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          package=$(node --input-type=module -e 'import fs from "node:fs"; const [pack]=JSON.parse(fs.readFileSync(process.argv[1])); console.log(pack.filename);' "$RUNNER_TEMP/keryx-mcp-pack.json")
          node mcp/scripts/test-packed.mjs "$RUNNER_TEMP/$package" "$(npm root -g)/npm/bin/npm-cli.js"
