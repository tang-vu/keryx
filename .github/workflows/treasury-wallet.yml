name: Existing treasury wallet custody

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  custody:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Pin repository npm installer
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Synthetic existing custody and independent process checks
        run: npx vitest run lib/payments/persistent-treasury-wallet.test.ts lib/payments/treasury-spend-wallet.test.ts lib/payments/real-gateway-custody.test.ts lib/payments/real-gateway-privacy.test.ts
