name: Windows payment fixture acceptance

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "app/api/**"
      - "components/keryx/session-*"
      - "components/keryx/creator-owner-withdrawal-panel.tsx"
      - "scripts/funding-inspect*"
      - "package*.json"
      - "vitest.config.mts"
      - ".github/workflows/windows-payment-fixtures.yml"
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "app/api/**"
      - "components/keryx/session-*"
      - "components/keryx/creator-owner-withdrawal-panel.tsx"
      - "scripts/funding-inspect*"
      - "package*.json"
      - "vitest.config.mts"
      - ".github/workflows/windows-payment-fixtures.yml"
  workflow_dispatch:

jobs:
  funding-and-browser-journeys:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Pin project npm installer
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Keyless funding inspection and freshness failure paths
        run: npx vitest run lib/operator/gateway-funding-inspection.test.ts lib/payments/gateway-funding-readiness.test.ts
      - name: Authenticated transport and all synthetic browser journey variants
        run: npx vitest run lib/session/browser-session-http.test.ts lib/session/browser-session-journey.test.ts
      - name: TypeScript
        run: npm run typecheck
