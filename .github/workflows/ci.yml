name: CI

# Build the Next.js app and run the SourceRegistry contract tests on every push
# to main and on PRs. No secrets needed: the build degrades gracefully without
# env (offline mode) and the contract tests run on Hardhat's in-process network.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Unit tests (economic invariants)
        run: npm test

      - name: Agent quality regression (hermetic, no settlement)
        run: npm run eval:agent:ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Contract tests (SourceRegistry)
        # ts-node needs the CommonJS tsconfig; the app tsconfig uses bundler/esnext.
        run: npx hardhat --tsconfig tsconfig.hardhat.json test

      - name: Production dependency audit (high gate)
        run: npm audit --omit=dev --audit-level=high

      - name: Build (Next.js)
        run: npm run build

      - name: Lint (informational)
        # Non-blocking: surfaces issues without failing CI on pre-existing debt.
        run: npm run lint
        continue-on-error: true

  publish-release:
    name: Publish versioned GitHub release
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve package version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create missing tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already has a public GitHub release"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Keryx $TAG" --generate-notes --latest
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Keryx $TAG" --generate-notes --latest
          fi
