name: CI

# Secret-free acceptance for the merged PR tree and exact main source.
# See docs/development-workflow.md for scope, batching and release gates.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Main validation cancels per lane; the aggregate cannot hold a shared workflow lock.
jobs:
  scope:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-scope-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.changes.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Check scope and aggregate failure handling
        run: node --test scripts/ci-scope.test.mjs scripts/ci-browser-apt.test.mjs
      - name: Classify PR merged-tree changes (main and unknown mean full)
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-scope.mjs

  checks:
    needs: scope
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-checks-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Pin project npm installer
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: CI scope and merge gate regression checks
        run: node --test scripts/ci-scope.test.mjs

      - name: Payment glossary consistency and review bindings (offline)
        run: |
          node --test scripts/check-payment-glossaries.test.mjs
          node scripts/check-payment-glossaries.mjs

      - name: Adversarial report lifecycle and source binding (offline)
        run: node --test scripts/source-money-adversarial-report.test.mjs

      - name: Circle/Arc integration ledger (offline paths and proof links)
        run: |
          node --test scripts/circle-arc-integration-ledger.test.mjs
          node scripts/circle-arc-integration-ledger.mjs

      - name: Typecheck (tsc)
        if: needs.scope.outputs.scope == 'full'
        run: npm run typecheck

      - name: Private profiles PostgreSQL ownership, collision and privacy acceptance
        if: needs.scope.outputs.scope == 'full'
        run: node --import tsx scripts/test-private-profiles-postgres.mts

      - name: Engineering feed integrity (no settlement)
        run: node --import tsx scripts/build-engineering-feed.mts --check

      - name: Compile contracts
        if: needs.scope.outputs.scope == 'full'
        run: npx hardhat compile

      - name: Contract tests (SourceRegistry)
        # ts-node needs the CommonJS tsconfig; the app tsconfig uses bundler/esnext.
        if: needs.scope.outputs.scope == 'full'
        run: npx hardhat --tsconfig tsconfig.hardhat.json test

      - name: Production dependency audit (high gate)
        if: needs.scope.outputs.scope == 'full'
        run: |
          node --test scripts/security-dependencies.test.mjs scripts/sharp-security.test.mjs
          npm audit --omit=dev --audit-level=high

  unit-tests:
    name: Unit tests (${{ matrix.shard }}/3)
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-unit-tests-${{ matrix.shard }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Pin project npm installer
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Browser runner APT setup tests (no system changes)
        run: node --test scripts/ci-browser-apt.test.mjs

      - name: Prepare official Ubuntu HTTPS mirrors for browser dependencies
        run: node scripts/ci-browser-apt.mjs

      - name: Install Chromium for unit and browser checks
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Unit tests (economic invariants)
        run: npm test -- --shard=${{ matrix.shard }}/3

  integration:
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-integration-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Pin project npm installer
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Tailwind authored source scope (synthetic retained builds)
        run: node scripts/test-tailwind-source-scope.mjs

      - name: Public-origin Next server (pinned Next fixture, loopback only)
        run: node --test scripts/next-public-server.test.mjs

      - name: Scheduled source upkeep Worker (isolated Free worker, no deployment)
        run: |
          npm ci --prefix cloudflare/source-upkeep --no-audit --no-fund
          npx tsc -p cloudflare/source-upkeep/tsconfig.json
          npm run build --prefix cloudflare/source-upkeep
          npm run test:runtime --prefix cloudflare/source-upkeep

      - name: Deployment dependency-state checks (no install or network)
        run: |
          bash scripts/private-worker-deploy.check.sh
          bash scripts/withdrawal-cycle-deploy.check.sh
          bash scripts/redeploy-vps.check.sh
          node --test scripts/redeploy-reviewed-roles.test.mjs
          node --test scripts/redeploy-economic-migration.test.mjs
          node --test scripts/redeploy.test.mjs
          node --test scripts/dependency-state.check.mjs
          node --test scripts/release-ops-preflight.test.mjs
          node --test scripts/immutable-release-staging.test.mjs
          node scripts/rehearse-immutable-release.mjs
          node scripts/dependency-state.mjs record
          node scripts/dependency-state.mjs check

      - name: Buyer CLI startup (no wallet or network)
        run: node --import tsx scripts/buyer-agent.mts --help

      - name: Finite Operator canary CLI startup (no environment, wallet or network)
        run: node --import tsx scripts/operator-canary.mts --help

      - name: Retained original continuation CLI startup (no environment, wallet or network)
        run: node --import tsx scripts/continue-canary-original.mts --help

      - name: Private economics CLI startup (no environment or database)
        run: node --import tsx scripts/economics-private-report.mts --help

      - name: Creator owner cash-out CLI startup (no environment, wallet or network)
        run: |
          node --import tsx scripts/creator-cashout-batch.mts --help
          node --import tsx scripts/creator-cashout-batch-sign.mts --help
          node --import tsx scripts/creator-cashout-batch-funding.mts --help

      - name: Synthetic research provenance (isolated PostgreSQL 17, synthetic data)
        run: node --import tsx scripts/test-synthetic-provenance-postgres.mts

      - name: Business Operator whole inventory (isolated PostgreSQL 17, no payments)
        run: node --import tsx scripts/test-operator-business-postgres.mts

      - name: Exact paid original claim (isolated PostgreSQL 17, no payments)
        run: node --import tsx scripts/test-a2a-original-claim-postgres.mts

      - name: Stdio MCP original paid-job polling (hermetic, no settlement)
        run: npx vitest run --config mcp/vitest.config.mts

      - name: Private economics report (Linux CLI, synthetic database, no network)
        run: node --import tsx --no-warnings scripts/test-private-economics-report.mts

      - name: Private worker Linux shutdown and crash (synthetic payments, network blocked)
        run: node --import tsx scripts/test-private-worker-drain.mts

      - name: Creator withdrawal admission (isolated PostgreSQL, synthetic data)
        run: node --import tsx scripts/test-creator-withdrawal-postgres.mts

      - name: Research Monthly admission (isolated PostgreSQL, synthetic data)
        run: node --import tsx scripts/test-research-monthly-postgres.mts

      - name: Withdrawal backup and recovered copy (Linux CLI, synthetic data)
        run: node --import tsx --no-warnings scripts/test-withdrawal-backup-restore.mts

      - name: Built stdio Monthly and bibliography discovery (hermetic, no settlement)
        run: |
          node --test scripts/mcp-registry-release.test.mjs
          npm --prefix mcp run build
          node --import tsx scripts/test-monthly-mcp-package.mts
          node --import tsx scripts/test-paper-lookup-mcp-package.mts
          node --import tsx scripts/test-private-profiles-mcp-package.mts

      - name: Packed stdio research diagnostics, signing and recovery (synthetic)
        working-directory: mcp
        run: |
          mkdir -p "$RUNNER_TEMP/keryx-mcp-acceptance"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/keryx-mcp-acceptance"
          node scripts/test-packed.mjs "$(find "$RUNNER_TEMP/keryx-mcp-acceptance" -name '*.tgz' -type f)" "$(npm root -g)/npm/bin/npm-cli.js"

      - name: Agent quality regression (hermetic, no settlement)
        run: |
          npm run eval:agent:ci
          node --import tsx scripts/eval-research-boundary-corpus.mts --check
          npm run eval:workload:research -- --capture --fixtures
          npm run eval:workload:research -- --replay --fixtures
          npm run eval:workload:commerce

  browser-source:
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-browser-source-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Pin project npm installer
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Browser runner APT setup tests (no system changes)
        run: node --test scripts/ci-browser-apt.test.mjs

      - name: Prepare official Ubuntu HTTPS mirrors for browser dependencies
        run: node scripts/ci-browser-apt.mjs

      - name: Install Chromium for unit and browser checks
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Zotero RIS parser compatibility (pinned source, synthetic metadata)
        run: |
          mkdir -p .artifacts/reference-export
          curl --fail --silent --show-error --max-time 30 https://raw.githubusercontent.com/zotero/translators/c7551c1a4d5b9623273119c7fbadf8735731dc92/RIS.js -o .artifacts/reference-export/zotero-RIS.js
          node --import tsx scripts/test-zotero-ris.mts .artifacts/reference-export/zotero-RIS.js

      - name: Browser authorization admission (isolated PostgreSQL, synthetic data)
        run: node --import tsx scripts/test-browser-authorization-postgres.mts

      - name: Browser buyer recovery (hermetic, no settlement)
        run: npm run test:browser-buyer

      - name: Creator listing and onboarding on both profiles (synthetic wallet, no real signing)
        run: |
          node --import tsx scripts/test-browser-creator-listing.mts
          node --import tsx scripts/test-browser-creator-registration.mts
          node --import tsx scripts/test-browser-creator-onboarding.mts

      - name: Scholarly creator rights (hermetic wallet and HTTP, no settlement)
        run: npm run test:browser-scholarly-rights

      - name: Research-paper library (hermetic metadata, mobile and desktop)
        run: |
          npm run papers -- --q retrieval
          npm run papers:collect -- --help
          npm run test:browser-paper-library
          npm run test:browser-literature

      - name: Saved paper references through pinned Zotero RIS parser (synthetic metadata)
        run: node --import tsx scripts/test-paper-ris-import.mts .artifacts/reference-export/zotero-RIS.js

      - name: Public source claims (both profiles, mobile/desktop, hermetic wallet and HTTP)
        run: npm run test:browser-public-source-claim

      - name: Browser checkout UI (hermetic, no settlement)
        run: npm run test:browser-checkout

      - name: Monthly browser recovery (hermetic, no settlement)
        run: npm run test:browser-monthly

      - name: Funding replacement recovery (synthetic RPC, no signing)
        run: node --import tsx scripts/test-browser-funding-replacement.mts

      - name: Arc card onramp panel (real kit and popup, synthetic HTTP, no vendor call)
        run: node --import tsx scripts/test-browser-arc-card-onramp.mts

      - name: Browser sign-out (hermetic, no signing)
        run: npm run test:browser-auth

      - name: Circle Google SDK and OAuth return (synthetic vendor transport, no wallet or funds)
        run: npm run test:browser-circle-wallet

      - name: Session revoke and concurrent recovery (synthetic custody, no funds)
        run: node --import tsx scripts/test-browser-session-revoke.mts

      - name: Browser clock skew (synthetic login, no payment)
        run: node --import tsx scripts/test-browser-clock-skew.mts

      - name: Private history and result UI (hermetic, read-only)
        run: npm run test:browser-private-history

      - name: Private request commitment (hermetic, no signing)
        run: node --import tsx scripts/test-browser-private-commitment.mts

      - name: Isolated session worker and IndexedDB (synthetic, no funds)
        run: npm run test:browser-isolated-session

      - name: Private browser journal (hermetic, no settlement)
        run: npm run test:browser-private-journal

      - name: Creator withdrawal journal (hermetic, no settlement)
        run: npm run test:browser-withdrawal-journal

      - name: Creator account history (intercepted HTTP, no settlement)
        run: node --import tsx scripts/test-browser-withdrawal-history.mts

      - name: Private browser checkout (hermetic, no settlement)
        run: npm run test:browser-private-checkout

      - name: Business calculator UI (local arithmetic, no settlement)
        run: npm run test:business-calculator

  production:
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-production-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Pin project npm installer
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Browser runner APT setup tests (no system changes)
        run: node --test scripts/ci-browser-apt.test.mjs

      - name: Prepare official Ubuntu HTTPS mirrors for browser dependencies
        run: node scripts/ci-browser-apt.mjs

      - name: Install Chromium for unit and browser checks
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Normal mainnet production worker and CSP (synthetic, no funds)
        run: npm run test:browser-mainnet-normal-built

      - name: Build (Next.js)
        run: npm run build

      - name: Private bibliography snapshots (built routes, isolated SQLite and synthetic sessions)
        run: node --import tsx scripts/test-private-bibliography-built.mts

      - name: Empty evidence (actual minified production orchestrator, no network)
        run: npm run test:built-empty-evidence

      - name: Bounded research allowance (actual minified factory and orchestrator, synthetic providers)
        run: npm run test:built-research-allowance

      - name: Bounded document readers (assembled production trace, no network)
        run: node scripts/test-web-readers-traced.mjs

      - name: HTML evidence structure (actual minified reader and quote boundaries, no network)
        run: node scripts/test-built-html-evidence.cjs

      - name: Ordinary answer presentation (production CSS, synthetic and retained replay, no spending)
        run: npm run test:answer-presentation

      - name: Ordinary answer presentation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: answer-presentation-screenshots
          path: .artifacts/answer-presentation-*.png
          if-no-files-found: ignore

      - name: Research reading UX (offline Chromium and responsive layout)
        env:
          KERYX_FORCE_OFFLINE: "1"
          KERYX_UX_SCREENSHOT_DIR: ${{ runner.temp }}/research-ux-screenshots
        run: npm run test:browser-research-ux

      - name: Business Operator production page (offline Chromium, synthetic status)
        run: node --import tsx scripts/test-browser-operator-business.mts

      - name: Private profile UI (production CSS, synthetic owner sessions, no outbound requests)
        run: node --import tsx scripts/test-browser-private-profiles.mts

      - name: Report feedback confirmation and response races (built CSS, hermetic Chromium)
        env:
          KERYX_FEEDBACK_SCREENSHOT_DIR: ${{ runner.temp }}/feedback-ux-screenshots
        run: npm run test:browser-answer-feedback

      - name: Report feedback screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feedback-ux-screenshots
          path: ${{ runner.temp }}/feedback-ux-screenshots
          if-no-files-found: ignore

      - name: Literature workspace built navigation and responsive UI (offline, no research)
        env:
          KERYX_LITERATURE_SCREENSHOT_DIR: ${{ runner.temp }}/literature-ux-screenshots
        run: npm run test:browser-literature-built

      - name: Stored excerpt readability (built CSS, hermetic Chromium)
        env:
          KERYX_EVIDENCE_SCREENSHOT_DIR: ${{ runner.temp }}/evidence-readability
        run: node --import tsx scripts/test-browser-evidence-readability.mts

      - name: Stored excerpt readability screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-readability-screenshots
          path: ${{ runner.temp }}/evidence-readability
          if-no-files-found: ignore

      - name: Model output-limit notice (built CSS, hermetic Chromium)
        env:
          KERYX_OUTPUT_LIMIT_SCREENSHOT_DIR: ${{ runner.temp }}/output-limit-ux-screenshots
        run: npm run test:browser-output-limit

      - name: Model output-limit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-limit-ux-screenshots
          path: ${{ runner.temp }}/output-limit-ux-screenshots
          if-no-files-found: ignore

      - name: Literature workspace screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: literature-ux-screenshots
          path: ${{ runner.temp }}/literature-ux-screenshots
          if-no-files-found: ignore

      - name: Research reading UX screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-ux-screenshots
          path: ${{ runner.temp }}/research-ux-screenshots
          if-no-files-found: ignore

      - name: Withdrawal production framework headers (loopback, no authentication or payment)
        env:
          # This secret-free CI server must use explicit offline cache semantics.
          # Real production startup correctly requires CONTENT_MASTER_KEY.
          KERYX_FORCE_OFFLINE: "1"
        run: node --import tsx scripts/test-withdrawal-framework-headers.mts

  lint:
    name: Lint (informational, outside merge gate)
    continue-on-error: true
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-lint-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Pin project npm installer
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (informational)
        # Non-blocking: surfaces issues without failing CI on pre-existing debt.
        run: npm run lint
        continue-on-error: true

  # Preserve the existing status name while refusing failed/missing required lanes.
  build-and-test:
    # Ungrouped: failure/cancellation evidence cannot lock out the newer PR run.
    if: always()
    needs: [scope, checks, unit-tests, integration, browser-source, production]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Require every applicable lane
        env:
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs
      - name: Refuse whole-workflow cancellation
        if: cancelled()
        run: exit 1

  publish-release:
    name: Publish versioned GitHub release
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve package version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create missing tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already has a public GitHub release"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Keryx $TAG" --generate-notes --latest
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Keryx $TAG" --generate-notes --latest
          fi
