name: CI

# Build the Next.js app and run the SourceRegistry contract tests on every push
# to main and on PRs. No secrets needed: the build degrades gracefully without
# env (offline mode) and the contract tests run on Hardhat's in-process network.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Pin project npm installer
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Scheduled source upkeep Worker (isolated Free worker, no deployment)
        run: |
          npm ci --prefix cloudflare/source-upkeep --no-audit --no-fund
          npx tsc -p cloudflare/source-upkeep/tsconfig.json
          npm run build --prefix cloudflare/source-upkeep
          npm run test:runtime --prefix cloudflare/source-upkeep

      - name: Deployment dependency-state checks (no install or network)
        run: |
          bash scripts/private-worker-deploy.check.sh
          bash scripts/withdrawal-cycle-deploy.check.sh
          node --test scripts/dependency-state.check.mjs
          node --test scripts/release-ops-preflight.test.mjs
          node scripts/dependency-state.mjs record
          node scripts/dependency-state.mjs check

      - name: Buyer CLI startup (no wallet or network)
        run: node --import tsx scripts/buyer-agent.mts --help

      - name: Private economics CLI startup (no environment or database)
        run: node --import tsx scripts/economics-private-report.mts --help

      - name: Creator owner cash-out CLI startup (no environment, wallet or network)
        run: |
          node --import tsx scripts/creator-cashout-batch.mts --help
          node --import tsx scripts/creator-cashout-batch-sign.mts --help
          node --import tsx scripts/creator-cashout-batch-funding.mts --help

      - name: Install Chromium for unit and browser checks
        run: npx playwright install --with-deps chromium

      - name: Unit tests (economic invariants)
        run: npm test

      - name: Private economics report (Linux CLI, synthetic database, no network)
        run: node --import tsx --no-warnings scripts/test-private-economics-report.mts

      - name: Private worker Linux shutdown and crash (synthetic payments, network blocked)
        run: node --import tsx scripts/test-private-worker-drain.mts

      - name: Creator withdrawal admission (isolated PostgreSQL, synthetic data)
        run: node --import tsx scripts/test-creator-withdrawal-postgres.mts

      - name: Research Monthly admission (isolated PostgreSQL, synthetic data)
        run: node --import tsx scripts/test-research-monthly-postgres.mts
      - name: Browser authorization admission (isolated PostgreSQL, synthetic data)
        run: node --import tsx scripts/test-browser-authorization-postgres.mts

      - name: Synthetic research provenance (isolated PostgreSQL 17, synthetic data)
        run: node --import tsx scripts/test-synthetic-provenance-postgres.mts

      - name: Withdrawal backup and recovered copy (Linux CLI, synthetic data)
        run: node --import tsx --no-warnings scripts/test-withdrawal-backup-restore.mts

      - name: Browser buyer recovery (hermetic, no settlement)
        run: npm run test:browser-buyer

      - name: Creator listing and onboarding on both profiles (synthetic wallet, no real signing)
        run: |
          node --import tsx scripts/test-browser-creator-listing.mts
          node --import tsx scripts/test-browser-creator-registration.mts
          node --import tsx scripts/test-browser-creator-onboarding.mts

      - name: Scholarly creator rights (hermetic wallet and HTTP, no settlement)
        run: npm run test:browser-scholarly-rights

      - name: Browser checkout UI (hermetic, no settlement)
        run: npm run test:browser-checkout

      - name: Monthly browser recovery (hermetic, no settlement)
        run: npm run test:browser-monthly

      - name: Built stdio Monthly discovery (hermetic, no settlement)
        run: |
          npm --prefix mcp run build
          node --import tsx scripts/test-monthly-mcp-package.mts

      - name: Funding replacement recovery (synthetic RPC, no signing)
        run: node --import tsx scripts/test-browser-funding-replacement.mts

      - name: Browser sign-out (hermetic, no signing)
        run: npm run test:browser-auth
      - name: Session revoke and concurrent recovery (synthetic custody, no funds)
        run: node --import tsx scripts/test-browser-session-revoke.mts
      - name: Browser clock skew (synthetic login, no payment)
        run: node --import tsx scripts/test-browser-clock-skew.mts

      - name: Private history and result UI (hermetic, read-only)
        run: npm run test:browser-private-history

      - name: Private request commitment (hermetic, no signing)
        run: node --import tsx scripts/test-browser-private-commitment.mts

      - name: Isolated session worker and IndexedDB (synthetic, no funds)
        run: npm run test:browser-isolated-session

      - name: Normal mainnet production worker and CSP (synthetic, no funds)
        run: npm run test:browser-mainnet-normal-built

      - name: Private browser journal (hermetic, no settlement)
        run: npm run test:browser-private-journal

      - name: Creator withdrawal journal (hermetic, no settlement)
        run: npm run test:browser-withdrawal-journal

      - name: Creator account history (intercepted HTTP, no settlement)
        run: node --import tsx scripts/test-browser-withdrawal-history.mts

      - name: Private browser checkout (hermetic, no settlement)
        run: npm run test:browser-private-checkout

      - name: Business calculator UI (local arithmetic, no settlement)
        run: npm run test:business-calculator

      - name: Agent quality regression (hermetic, no settlement)
        run: |
          npm run eval:agent:ci
          node --import tsx scripts/eval-research-boundary-corpus.mts --check

      - name: Engineering feed integrity (no settlement)
        run: node --import tsx scripts/build-engineering-feed.mts --check

      - name: Compile contracts
        run: npx hardhat compile

      - name: Contract tests (SourceRegistry)
        # ts-node needs the CommonJS tsconfig; the app tsconfig uses bundler/esnext.
        run: npx hardhat --tsconfig tsconfig.hardhat.json test

      - name: Production dependency audit (high gate)
        run: npm audit --omit=dev --audit-level=high

      - name: Build (Next.js)
        run: npm run build

      - name: Empty evidence (actual minified production orchestrator, no network)
        run: npm run test:built-empty-evidence

      - name: Bounded document readers (assembled production trace, no network)
        run: node scripts/test-web-readers-traced.mjs

      - name: Research reading UX (offline Chromium and responsive layout)
        env:
          KERYX_FORCE_OFFLINE: "1"
          KERYX_UX_SCREENSHOT_DIR: ${{ runner.temp }}/research-ux-screenshots
        run: npm run test:browser-research-ux

      - name: Research reading UX screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-ux-screenshots
          path: ${{ runner.temp }}/research-ux-screenshots
          if-no-files-found: ignore

      - name: Withdrawal production framework headers (loopback, no authentication or payment)
        env:
          # This secret-free CI server must use explicit offline cache semantics.
          # Real production startup correctly requires CONTENT_MASTER_KEY.
          KERYX_FORCE_OFFLINE: "1"
        run: node --import tsx scripts/test-withdrawal-framework-headers.mts

      - name: Lint (informational)
        # Non-blocking: surfaces issues without failing CI on pre-existing debt.
        run: npm run lint
        continue-on-error: true

  publish-release:
    name: Publish versioned GitHub release
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve package version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create missing tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already has a public GitHub release"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Keryx $TAG" --generate-notes --latest
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Keryx $TAG" --generate-notes --latest
          fi
