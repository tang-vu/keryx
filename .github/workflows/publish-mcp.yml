name: Publish MCP to npm and official Registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: Committed mcp/package.json version to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-keryx-mcp
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'tang-vu/keryx' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require successful main CI for this exact commit
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (main.data.commit.sha !== context.sha) throw new Error('Dispatch must target current main');
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ci.yml', head_sha: context.sha, event: 'push', per_page: 100
            });
            if (!runs.data.workflow_runs.some(run => run.head_branch === 'main' && run.status === 'completed' && run.conclusion === 'success')) {
              throw new Error('Wait for successful CI on this exact main commit before publishing');
            }
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install pinned npm and committed build dependencies
        run: |
          npm install --global npm@11.19.0 --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm --prefix mcp ci --ignore-scripts --no-audit --no-fund
      - name: Verify committed package and requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('mcp/package.json', 'utf8'));
          assert.equal(pkg.name, 'keryx-mcp');
          assert.equal(pkg.version, process.env.EXPECTED_VERSION);
          assert.match(pkg.version, /^\d+\.\d+\.\d+$/);
          assert.equal(pkg.repository.url, 'git+https://github.com/tang-vu/keryx.git');
          assert.equal(pkg.repository.directory, 'mcp');
          assert.notEqual(pkg.private, true);
          NODE
          node --test scripts/mcp-registry-release.test.mjs
          node scripts/mcp-registry-release.mjs validate
      - name: Build and inspect the exact release archive
        run: |
          npm --prefix mcp run build
          node --check mcp/dist/keryx-mcp.mjs
          node --import tsx scripts/test-monthly-mcp-package.mts
          mkdir release
          (cd mcp && npm pack --ignore-scripts --json --pack-destination ../release) > release/pack.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const [pack] = JSON.parse(fs.readFileSync('release/pack.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('mcp/package.json', 'utf8'));
          assert.equal(pack.name, pkg.name);
          assert.equal(pack.version, pkg.version);
          const paths = pack.files.map(file => file.path);
          for (const required of ['package.json', 'README.md', 'dist/keryx-mcp.mjs']) assert(paths.includes(required), required);
          assert.equal(paths.length, 3);
          assert(paths.every(path => ['package.json', 'README.md', 'dist/keryx-mcp.mjs'].includes(path)), 'Unexpected archive file');
          NODE
          sha256sum release/*.tgz > release/SHA256SUMS
      - name: Verify exact packaged consumer with synthetic signing and recovery
        run: |
          package=$(node --input-type=module -e 'import fs from "node:fs"; const [pack] = JSON.parse(fs.readFileSync("release/pack.json", "utf8")); console.log("release/" + pack.filename);')
          node mcp/scripts/test-packed.mjs "$package" "$(npm root -g)/npm/bin/npm-cli.js"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: verify
    if: github.repository == 'tang-vu/keryx' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: npm install --global npm@11.19.0 --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: npm-release
          path: release/
      - name: Check verified archive and exact npm version before any publication
        id: npm-preflight
        timeout-minutes: 1
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          sha256sum --check release/SHA256SUMS
          node scripts/mcp-registry-release.mjs preflight-npm
      - name: Publish verified archive once using npm Trusted Publishing
        if: steps.npm-preflight.outputs.state == 'absent'
        timeout-minutes: 3
        run: |
          npm publish ./release/*.tgz --ignore-scripts --access public --provenance --registry https://registry.npmjs.org/ --fetch-retries=0
      - name: Verify public registry version and integrity
        if: ${{ !cancelled() && steps.npm-preflight.outcome == 'success' }}
        timeout-minutes: 7
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          # Publishing can succeed before the public registry finishes processing.
          # Retry reads only; never repeat the immutable package publication.
          available=0
          for attempt in $(seq 1 18); do
            if npm view "keryx-mcp@$EXPECTED_VERSION" --json --registry https://registry.npmjs.org/ --fetch-retries=0 --fetch-timeout=10000 > published.json; then
              available=1
              break
            fi
            echo "Public registry readback not available yet (attempt $attempt/18)."
            if [ "$attempt" -lt 18 ]; then sleep 10; fi
          done
          if [ "$available" -ne 1 ]; then
            echo "Publication was submitted; public readback remains unverified. Do not republish."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const published = JSON.parse(fs.readFileSync('published.json', 'utf8'));
          const [pack] = JSON.parse(fs.readFileSync('release/pack.json', 'utf8'));
          assert.equal(published.version, process.env.EXPECTED_VERSION);
          assert.equal(published.dist.integrity, pack.integrity);
          NODE
          node scripts/mcp-registry-release.mjs verify-npm
      - name: Check exact official Registry version before any publication
        id: registry-preflight
        timeout-minutes: 1
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: node scripts/mcp-registry-release.mjs preflight
      - name: Install pinned official MCP publisher
        if: steps.registry-preflight.outputs.state == 'absent'
        timeout-minutes: 2
        run: |
          mkdir "$RUNNER_TEMP/mcp-publisher"
          curl --fail --location --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/mcp-publisher/archive.tar.gz"
          # Official release asset digest verified through the GitHub Releases API.
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mcp-publisher/archive.tar.gz" -C "$RUNNER_TEMP/mcp-publisher" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher/mcp-publisher" validate mcp/server.json
      - name: Publish exact manifest once using repository-owner GitHub OIDC
        if: steps.registry-preflight.outputs.state == 'absent'
        timeout-minutes: 2
        run: |
          publisher="$RUNNER_TEMP/mcp-publisher/mcp-publisher"
          trap '"$publisher" logout >/dev/null 2>&1 || true' EXIT
          "$publisher" login github-oidc --registry=https://registry.modelcontextprotocol.io
          # One submission only. A timeout or uncertain response must be inspected,
          # never followed by a blind repeat of this command.
          "$publisher" publish mcp/server.json
      - name: Verify exact and latest public MCP Registry manifests
        # Read back even if the one publish command had an ambiguous response.
        # That failure still fails the job; this step never retries publication.
        if: ${{ !cancelled() && steps.registry-preflight.outcome == 'success' }}
        timeout-minutes: 6
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: node scripts/mcp-registry-release.mjs verify
