name: Gateway funding executor

on:
  push:
    paths:
      - 'lib/db/**'
      - 'lib/payments/gateway-funding-**'
      - 'lib/canonical-json.ts'
      - 'package*.json'
      - 'tsconfig.json'
      - 'eslint.config.*'
      - 'vitest.config.*'
      - '.github/workflows/gateway-funding-executor.yml'
  pull_request:
    paths:
      - 'lib/db/**'
      - 'lib/payments/gateway-funding-**'
      - 'lib/canonical-json.ts'
      - 'package*.json'
      - 'tsconfig.json'
      - 'eslint.config.*'
      - 'vitest.config.*'
      - '.github/workflows/gateway-funding-executor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-executor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
          cache: npm
      - run: npm ci
      - name: Native SQLite, local HTTP, installed viem and child crash proofs
        run: npx vitest run lib/payments/gateway-funding-executor.test.ts
      - name: Project TypeScript
        run: npx tsc --noEmit
      - name: Dedicated subprocess TypeScript
        run: npx tsc --noEmit --skipLibCheck --strict --target es2017 --lib dom,dom.iterable,esnext --module esnext --moduleResolution bundler --esModuleInterop --allowImportingTsExtensions lib/payments/gateway-funding-executor-child.mts
      - name: Executor lint
        run: npx eslint lib/payments/gateway-funding-executor.ts lib/payments/gateway-funding-executor.test.ts lib/payments/gateway-funding-executor-child.mts
