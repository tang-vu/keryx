name: Gateway current funding readiness candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness-native-boundaries:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.10.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check project types
        run: npx tsc --noEmit
      - name: Lint readiness issuer and actual native fixtures
        run: npx eslint lib/payments/gateway-funding-readiness.ts lib/payments/gateway-funding-readiness.test.ts
      - name: Native readonly ledger and localhost HTTP availability (synthetic only)
        run: npx vitest run lib/payments/gateway-funding-readiness.test.ts lib/gateway/available-balance.test.ts
