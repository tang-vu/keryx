# Prepared PostgreSQL only. Resource envelope remains a separate, verified gate.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=3

[Service]
# PostgreSQL's postmaster handles an OOM-killed backend. If the main process
# fails, systemd restarts the instance within the bounded restart policy.
OOMPolicy=continue
Restart=on-failure
RestartSec=5s
TimeoutStopSec=30s
