# Scope this drop-in to postgresql@17-keryx.service only.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=3

[Service]
Type=simple
User=postgres
Group=root
PIDFile=
ExecStart=
ExecStart=/usr/lib/postgresql/17/bin/postgres -D /var/lib/postgresql/17/keryx -c config_file=/etc/postgresql/17/keryx/postgresql.conf
ExecStop=
ExecReload=
RuntimeDirectory=postgresql-keryx
RuntimeDirectoryMode=0750
UMask=0077
Restart=on-failure
RestartSec=5
KillSignal=SIGINT
KillMode=mixed
SendSIGKILL=no
TimeoutStopSec=120
MemoryMax=1073741824
MemorySwapMax=0
CPUQuota=75%
TasksMax=64
NoNewPrivileges=yes
CapabilityBoundingSet=
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
ReadWritePaths=/var/lib/postgresql/17/keryx /run/postgresql-keryx
RestrictAddressFamilies=AF_UNIX
