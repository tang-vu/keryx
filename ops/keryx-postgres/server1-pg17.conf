# Dedicated server1 Keryx WSL preparation; no application enrollment.
data_directory = '/var/lib/postgresql/17/keryx'
hba_file = '/etc/postgresql/17/keryx/pg_hba.conf'
ident_file = '/etc/postgresql/17/keryx/pg_ident.conf'
listen_addresses = ''
port = 5432
unix_socket_directories = '/run/postgresql-keryx'
unix_socket_group = 'root'
unix_socket_permissions = 0770
max_connections = 24
shared_buffers = '128MB'
work_mem = '4MB'
maintenance_work_mem = '64MB'
max_wal_size = '512MB'
min_wal_size = '80MB'
fsync = on
synchronous_commit = on
full_page_writes = on
password_encryption = 'scram-sha-256'
timezone = 'UTC'
log_timezone = 'UTC'
logging_collector = off
log_destination = 'stderr'
log_connections = off
log_disconnections = off
log_statement = 'none'
log_min_duration_statement = -1
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
